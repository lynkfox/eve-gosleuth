# Releases the app whenever info.productVersion in wails.json changes on main.
# Tests and vets, cross-builds the Windows exe as in CLAUDE.md, writes the notes with git-cliff
# (cliff.toml) from the conventional commits since the last tag, adds the Readme's Installing
# section after them, and publishes release vX.Y.Z,
# which creates that tag. A version that already has a tag is skipped, so other edits to
# wails.json don't release. 0.x versions are marked pre-release.
name: Release

on:
  push:
    branches: [main]
    paths: [wails.json]
  workflow_dispatch: # retry a failed release of the current version

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-cliff needs the history and the tags

      - name: Read the version
        id: version
        run: |
          version=$(jq -r '.info.productVersion' wails.json)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=wails.json::info.productVersion '$version' isn't three numbers"
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          case "$version" in
            0.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-go@v5
        if: steps.version.outputs.skip == 'false'
        with:
          go-version-file: go.mod

      - name: Test
        if: steps.version.outputs.skip == 'false'
        run: |
          go test ./...
          GOOS=windows go vet ./...

      - name: Build the Windows exe
        if: steps.version.outputs.skip == 'false'
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          wails build -platform windows/amd64 -skipbindings
          cd build/bin
          zip "eve-gosleuth-${{ steps.version.outputs.version }}.zip" eve-gosleuth.exe

      - name: Write the release notes
        if: steps.version.outputs.skip == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.version.outputs.tag }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      # the Readme's Installing section (with its Updating part) goes under the changes, so the
      # release page says how to install; on that page the zip is right there, so no link to it
      - name: Add the install steps to the notes
        if: steps.version.outputs.skip == 'false'
        run: |
          install=$(awk '/^## Installing/ { on = 1 } on && /^## / && !/^## Installing/ { exit } on' Readme.md \
            | sed -E 's/Go to the \[release page\]\([^)]*\) and download/download/')
          if [ -z "$install" ]; then
            echo "::error file=Readme.md::no '## Installing' section to add to the release notes"
            exit 1
          fi
          printf '\n%s\n' "$install" >> RELEASE_NOTES.md

      - name: Publish the release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: EVE GoSleuth ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          fail_on_unmatched_files: true
          # the static data beside the zip is for the planned auto-updater (.claude/docs/build-pipeline.md)
          files: |
            build/bin/eve-gosleuth-${{ steps.version.outputs.version }}.zip
            static_data/fit_types.json
            static_data/dogma.json
