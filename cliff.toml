# git-cliff config: the release notes .github/workflows/release.yml writes for each version.
# Only the changes a user notices are listed; build, ci, chore, docs, refactor, and test
# commits are left out. Commits that don't follow the rules in CLAUDE.md are dropped.

[changelog]
header = ""
body = """
{#- an area as users read it: the names the app shows, else the area capitalized (fits is Fits) -#}
{%- macro area(scope) -%}
{%- if scope == "myintel" -%}My Intel
{%- elif scope == "holdings" -%}Affiliates
{%- elif scope == "static-data" -%}Static Data
{%- elif scope == "report" -%}Report Generation
{%- elif scope == "gui" or scope == "cli" -%}{{ scope | upper }}
{%- else -%}{{ scope | capitalize }}
{%- endif -%}
{%- endmacro area -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ self::area(scope=commit.scope) }}**: {% endif %}{{ commit.message }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  # a fix to something no release has had yet, which no user can have met (CLAUDE.md, Commit messages)
  { footer = "^changelog: ?ignore", skip = true },
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^revert", group = "<!-- 3 -->Reverted" },
  { message = ".*", skip = true },
]
