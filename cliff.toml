# git-cliff config: the release notes .github/workflows/release.yml writes for each version.
# Only the changes a user notices are listed; build, ci, chore, docs, refactor, and test
# commits are left out. Commits that don't follow the rules in CLAUDE.md are dropped.

[changelog]
header = ""
body = """
{#- an area as users read it: the names the app shows, else the area capitalized (fits is Fits) -#}
{%- macro area(scope) -%}
{%- if scope == "myintel" -%}My Intel
{%- elif scope == "holdings" -%}Affiliates
{%- elif scope == "static-data" -%}Static Data
{%- elif scope == "report" -%}Report Generation
{%- elif scope == "gui" or scope == "cli" -%}{{ scope | upper }}
{%- else -%}{{ scope | capitalize }}
{%- endif -%}
{%- endmacro area -%}
{#- each section lists its breaking changes first, then the rest in A to Z order of the area as shown, and of the change within it; those with no area come last, as ** sorts before a letter -#}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% set_global breaking = [] -%}
{% set_global others = [] -%}
{% for commit in commits -%}
{% set line = commit.message -%}
{% if commit.scope -%}
{% set shown = self::area(scope=commit.scope) -%}
{% set line = "**" ~ shown ~ "**: " ~ commit.message -%}
{% endif -%}
{% if commit.breaking -%}
{% set_global breaking = breaking | concat(with="**Breaking:** " ~ line) -%}
{% else -%}
{% set_global others = others | concat(with=line) -%}
{% endif -%}
{% endfor -%}
{% for line in breaking %}
- {{ line }}\
{% endfor -%}
{% for line in others | sort %}
- {{ line }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  # a fix to something no release has had yet, which no user can have met (CLAUDE.md, Commit messages)
  { footer = "^changelog: ?ignore", skip = true },
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^revert", group = "<!-- 3 -->Reverted" },
  { message = ".*", skip = true },
]
